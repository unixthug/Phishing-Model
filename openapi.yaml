swagger: "2.0"
info:
  title: RiskLens API
  description: Phishing URL scoring API
  version: "1.0.0"
schemes:
  - https
produces:
  - application/json
securityDefinitions:
  api_key:
    type: apiKey
    name: x-api-key
    in: header
security:
  - api_key: []
paths:
  /score:
    post:
      summary: Score a URL for phishing risk
      operationId: scoreUrl
      x-google-backend:
        address: https://risklens-api-188827671628.us-central1.run.app/score
        deadline: 30.0
      x-google-quota:
        metricCosts:
          score-requests: 1
      consumes:
        - application/json
      parameters:
        - in: body
          name: body
          required: true
          schema:
            type: object
            required:
              - url
            properties:
              url:
                type: string
      responses:
        "200":
          description: Successful scoring
        "400":
          description: Bad request
        "500":
          description: Server error
  /health:
    get:
      summary: Health check
      operationId: health
      security: []
      x-google-backend:
        address: https://risklens-api-188827671628.us-central1.run.app/health
      responses:
        "200":
          description: OK
x-google-management:
  metrics:
    - name: score-requests
      displayName: Score endpoint requests
      valueType: INT64
      metricKind: DELTA
  quota:
    limits:
      - name: score-per-minute-per-key
        metric: score-requests
        unit: 1/min/{project}
        values:
          STANDARD: 60